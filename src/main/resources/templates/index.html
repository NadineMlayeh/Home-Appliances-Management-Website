        <style>
        body {
            background-image: url("/img/fr.PNG");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            padding-top: 72px; /* clear the fixed admin header */
        }
        @media (max-width: 768px) {
            .main-menu {
                flex-direction: column;
            }
            .nav.menu {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        .header .main-menu {
            display: flex;
            justify-content: flex-start; /* Align items to the start */
            align-items: center;
        }

        .header .nav {
            display: flex;
            flex-wrap: nowrap; /* Prevent wrapping */
        }

        .header .nav li {
            margin-right: 5px; /* Adjust margin */
            padding: 5px 8px;  /* Adjust padding */
            flex-basis: auto;
            min-width: 0;
        }

        .header .nav li a {
            white-space: nowrap; /* Prevent text wrapping */
        }
        .btn {
            padding: 10px 20px; /* Adjust these values to control the size */
            font-size: 14px;   /* Adjust the font size if necessary */
            margin-top: -15px;
            color:white;
        }

        .logo{
            margin-left: 0px;
        }
        .badge.hidden {
            display: none;
        }
        </style>

    <body>

        <!-- Preloader -->
        <div class="preloader">
            <div class="loader">
                <div class="loader-outter"></div>
                <div class="loader-inner"></div>

                <div class="indicator"> 
                    <svg width="16px" height="12px">
                        <polyline id="back" points="1 6 4 6 6 11 10 1 12 6 15 6"></polyline>
                        <polyline id="front" points="1 6 4 6 6 11 10 1 12 6 15 6"></polyline>

                                </div>
                            </div>
                        </div>
                    </div>

                                    <p>gestion de stock, clients et articles. </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
