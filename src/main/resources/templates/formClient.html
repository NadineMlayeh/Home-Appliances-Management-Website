<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter un client</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/assets/css/admin-header.css">

    <style>
        @import url("https://fonts.googleapis.com/css?family=Poppins:wght@300,400,500,600,700,900");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('img.jpg') no-repeat;
            background-size: cover;
            background-position: center;
            padding-top: 70px; /* clear the fixed admin header */
        }
        
        .wrapper {
            width: 750px;
            background: #ffffff;
            border: 1px solid #e6ebf1;
            box-shadow: 0 8px 24px rgba(15, 44, 89, 0.14);
            border-radius: 14px;
            color: #1e3347;
            padding: 32px 35px 42px;
            margin: 0 10px;
        }
        
        .wrapper h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 16px;
            color: #2b3a4a;
            font-weight: 700;
            text-shadow: none;
        }

        .input-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            -webkit-column-gap: 24px;
            -moz-column-gap: 24px;
            column-gap: 24px;
        }
        
        .input-box .input-field {
            position: relative;
            width: 100%;
            height: 46px;
            margin: 10px 0;
        }

        .input-box .input-field.full-width {
            grid-column: 1 / -1;
            width: 100%;
            margin: 10px 0;
        }
        .input-box .btn {
            grid-column: 1 / -1;
            margin-top: 14px;
        }

        .input-box .input-field input {
            width: 100%;
            height: 100%;
            background: #fff;
            border: 2px solid #dbe4ef;
            outline: none;
            font-size: 15px;
            color: #1e3347;
            border-radius: 8px;
            padding: 14px 15px 14px 42px;
            transition: all 0.3s ease;
        }

        .input-box .input-field input:focus {
            border-color: #308dc0;
            box-shadow: 0 0 8px rgba(48, 141, 192, 0.35);
            background: #fff;
        }

        .input-box .input-field input::placeholder {
            color: transparent; /* Hide the placeholder text */
        }

        .input-box .input-field label {
            position: absolute;
            top: 50%;
            left: 42px;
            transform: translateY(-50%);
            color: #6b7a8d;
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: 500;
        }

        .input-box .input-field i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #8aa0b8;
            transition: all 0.3s ease;
        }

        .input-box .input-field input:focus + label,
        .input-box .input-field input:not(:placeholder-shown) + label {
            top: -15px;
            font-size: 12px;
            color: #308dc0;
            background: #fff;
            padding: 0 6px;
        }

        .input-box .input-field input:focus ~ i,
        .input-box .input-field input:not(:placeholder-shown) ~ i {
            top: -15px;
            font-size: 12px;
            color: #308dc0;
        }


        .btn {
            width: 100%;
            height: 45px;
            background: linear-gradient(135deg, #308dc0, #256e9c);
            border: none;
            outline: none;
            border-radius: 9px;
            box-shadow: 0 4px 12px rgba(48, 141, 192, 0.35);
            cursor: pointer;
            font-size: 16px;
            color: #fff;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn:hover {
            background: linear-gradient(135deg, #256e9c, #308dc0);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(48, 141, 192, 0.45);
        }
        @media (max-width: 576px) {
            .input-box .input-field {
                width: 100%;
                margin: 10px 0;
            }
        }
        h1 {
            font-size: 1.6rem;
            color: #2b3a4a;
            font-weight: 700;
            text-shadow: none;
        }

        h1:hover {
            text-shadow: none;
        }

    </style>
</head>
<body>
 	<div th:replace="~{fragments/adminheader :: adminheadernav('clients')}"></div>
 	<div class="wrapper">   
    <form action="#" th:action="@{/saveClient}" th:object="${client}" method="post">
    <h1>Ajouter client</h1>
      <div class="input-box">
        <input type="hidden" th:field="*{id}" />

       <div class="input-field">
            <input type="text" id="nom" th:field="*{nom}" required placeholder=" ">
            <label for="nom">Nom </label>
            <i class='bx bxs-user'></i>
       </div>
        <div class="input-field">
            <input type="text" id="prenom" th:field="*{prenom}"  required placeholder=" ">
            <label for="prenom">Prenom</label>
            <i class='bx bxs-user'></i>
        </div>        
        <div class="input-field">
            <input type="text" id="dateNaissance" data-type="date" th:field="*{dateNaissance}" placeholder="Date de naissance" required>
            <label for="dob">Date de naissance</label>
            <i class='bx bxs-calendar'></i>
        </div>
        <div class="input-field">
            <input type="text" id="numTelephone" th:field="*{numTelephone}" required placeholder=" ">
            <label for="numero-tel">Numero telephonique</label>
            <i class='bx bxs-phone'></i>
        </div> 
         <div class="input-field full-width">
            <input type="text" id="adresse" th:field="*{adresse}" required placeholder=" ">
            <label for="adresse">Adresse</label>
            <i class='bx bxs-map'></i>
        </div> 
            <button class="btn" type="submit" >Enregistrer</button>
        </div>
    </form>
    </div>
     <script>
        document.querySelectorAll('input[data-type="date"]').forEach(function(input) {
            input.addEventListener('focus', function() {
                this.type = 'date';
            });
            input.addEventListener('blur', function() {
                if (this.value === "") {
                    this.type = 'text';
                }
            });
        });
    </script>
</body>
</html>
