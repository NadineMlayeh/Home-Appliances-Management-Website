<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter Achat</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
    @import url("https://fonts.googleapis.com/css?family=Poppins:wght@300,400,500,600,700,900");
        .hidden {
            display: none;
        }
        .tranche-container {
            display: flex;
            flex-direction: column;
            margin-top: 10px;
        }
		/* Error message styling */
		.error {
		    color: red;
		    font-size: 14px;
		    font-weight: bold;
		    margin-top: 5px;
		    background-color: rgba(255, 107, 107, 0.2);
		    padding: 10px;
		    border-radius: 4px;
		    animation: shake 0.3s ease-in-out;
		    box-shadow: 0 0 10px rgba(255, 107, 107, 0.7);
		}
		.error::before { 
		    content: '\26A0'; /* Warning symbol */
		    font-size: 16px;
		    color: red;
		    margin-right: 8px;
		    vertical-align: middle;
		}
		/* Shake animation for error message */
		@keyframes shake {
		    0% { transform: translateX(0); }
		    25% { transform: translateX(-5px); }
		    50% { transform: translateX(5px); }
		    75% { transform: translateX(-5px); }
		    100% { transform: translateX(0); }
		}

        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('ele.jpg') no-repeat;
            background-size: cover;
            background-position: center;
        }
			
        
        .wrapper {
            width: 750px;
            background: rgba(247, 245, 245, 0.1);
            border: 2px solid rgba(255, 255, 255, .2);
            box-shadow: 0 0 10px rgba(0, 0, 0, .2);
            backdrop-filter: blur(80px);
            border-radius: 10px;
            color: #fff;
            padding: 40px 35px 55px;
            margin: 0 10px;
        }
        
        .wrapper h1 {
            font-size: 36px;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-box {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .input-box .input-field {
            position: relative;
            width: 48%;
            height: 50px;
            margin: 13px 0;
        }

        .input-box .input-field.full-width {
            width: 100%;
            margin: 20px auto;
        }
         .input-box .form-group.full-width {
            width: 100%;
            margin: 20px auto;
        }

        .input-box .input-field input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.792);
            outline: none;
            font-size: 16px;
            color: #000000;
            border-radius: 6px;
            padding: 15px 15px 15px 40px;
            transition: all 0.3s ease;
        }

        .input-box .input-field input:focus {
            border-color: #423f3f; /* Change the border color on focus */
            box-shadow: 0 0 8px #ffffff; /* Add a glow effect */
            background: rgba(255, 255, 255, .2); /* Slightly change the background on focus */
        }

        .input-box .input-field input::placeholder {
            color: transparent; /* Hide the placeholder text */
        }

        .input-box .input-field label {
            position: absolute;
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            color: #000000;
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .input-box .input-field i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #fff;
            transition: all 0.3s ease;
        }

        .input-box .input-field input:focus + label,
        .input-box .input-field input:not(:placeholder-shown) + label {
            top: -15px;
            font-size: 12px;
            color: #383535; /* Change the label color on focus */
        }

        .input-box .input-field input:focus ~ i,
        .input-box .input-field input:not(:placeholder-shown) ~ i {
            top: -15px;
            font-size: 12px;
            color: #0e0e0e; /* Change the icon color on focus */
        }


        .btn {
            width: 100%;
            height: 45px;
            background: #fff;
            border: none;
            outline: none;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            font-size: 16px;
            color: #4ba9c8;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2c87b5;
            box-shadow: 0 0 30px rgb(255, 255, 255); /* Intense lightning effect */
            color: #ffffff;
        }
        @media (max-width: 576px) {
            .input-box .input-field {
                width: 100%;
                margin: 10px 0;
            }
        }
		        h1 {
		    font-size: 2.5rem;
		    font-weight: bold;
		    color:#308dc0; /* Set the text color to black */
		    text-shadow: 
		        0 0 5px rgba(255, 255, 255, 1),
		        0 0 10px rgba(255, 255, 255, 1),
		        0 0 15px rgba(255, 255, 255, 1),
		        0 0 20px rgba(255, 255, 255, 1),
		        0 0 25px rgba(255, 255, 255, 1),
		        0 0 30px rgba(255, 255, 255, 1),
		        0 0 35px rgba(255, 255, 255, 1); /* Stronger white glow with more layers */
		    transition: text-shadow 0.3s;
		}

        h1:hover {
            text-shadow: 0 0 20px rgba(243, 235, 235, 0.9); /* Red glow on hover */
        }
        label{
            color: white;
        }
        i{
            color:#308dc0;
        }

    </style>
</head>
<body>
    <div class="wrapper">       
        <form action="#" th:action="@{/saveAchat}" th:object="${achat}" method="post">
           <h1>Ajouter Achat</h1>
           <div class="input-box">
            <div class="form-group full-width">
            <i class='bx bxs-user'></i>
                <label for="client">Client :</label>
                <select id="client" name="clientId" class="form-control" required>
                    <option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.id} + ' - ' + ${client.nom}"></option>
                </select>
            </div>
            <div class="form-group full-width">
            <i class='bx bx-package'></i>
                <label for="article">Article :</label>
                <select id="article" name="articleId" class="form-control" required onchange="calculateMontant()">
                    <option th:each="article : ${articles}" th:value="${article.id}" th:text="${article.id} + ' - ' + ${article.name}"></option>
                </select>
            </div>
            <div class="form-group full-width">
            <i class='bx bx-calendar'></i>
                <label for="dateAchat">Date d'Achat :</label>
                <input type="date" id="dateAchat" th:field="*{dateAchat}" class="form-control" required />
            </div>
            <div class="form-group full-width">
            <i class='bx bx-grid'></i>
                <label for="quantite">Quantite :</label>
                <input type="number" id="quantite" th:field="*{quantite}" class="form-control" required oninput="calculateMontant()" />
            </div>
            <div class="form-group full-width"> 
            <i class='bx bx-credit-card'></i>
                <label for="modePayment">Mode de Paiement :</label>
                <select id="modePayment" th:field="*{modePayment}" class="form-control" required onchange="calculateMontant()">
                    <option value="comptant">Comptant</option>
                    <option value="facilite">Facilite</option>
                </select>
            </div>
            <div class="form-group full-width">
            <i class='bx bxs-dollar-circle'></i>
                <label for="montant">Montant :</label>
                <input type="text" id="montant" th:field="*{montant}" readonly />
                <small id="facilite-note" class="form-text text-muted hidden">(+15%)</small>
            </div>
            <div class="form-group">
                <span id="error-message" class="text-danger hidden"></span>
            </div>

            <div id="faciliteSection" class="hidden">
            <i class='bx bx-circle bx-1'></i>
                <label for="avance">Avance:</label>
                <input type="text" id="avance" name="avance" class="form-control" oninput="updateTrancheVisibility()"><br><br>
                
                <div class="tranche-container" id="trancheContainer">
                    <div class="form-group hidden" id="tr1Field">
                    <i class='bx bx-circle bx-1'></i>
                        <label id="t1" for="tr1">Tranche 1:</label>
                        <input type="text" id="tr1" name="tr1" class="form-control hidden"  oninput="updateTrancheVisibility()">
                    </div>
                    <div class="form-group hidden" id="tr2Field">
                    <i class='bx bx-circle bx-1'></i>
                        <label id="t2" for="tr2">Tranche 2:</label>
                        <input type="text" id="tr2" name="tr2" class="form-control hidden" oninput="updateTrancheVisibility()">
                    </div>
                    <div class="form-group hidden" id="tr3Field">
                    <i class='bx bx-circle bx-1'></i>
                        <label id="t3" for="tr3">Tranche 3:</label>
                        <input type="text" id="tr3" name="tr3" class="form-control hidden" oninput="updateTrancheVisibility()">
                    </div>
                    <div class="form-group hidden" id="tr4Field">
                    <i class='bx bx-circle bx-1'></i>
                        <label id="t4" for="tr4">Tranche 4:</label>
                        <input type="text" id="tr4" name="tr4" class="form-control" oninput="updateTrancheVisibility()">
                    </div>
                    <div class="form-group hidden" id="tr5Field">
                    <i class='bx bx-circle bx-1'></i>
                        <label id="t5" for="tr5">Tranche 5:</label>
                        <input type="text" id="tr5" name="tr5" class="form-control" oninput="updateTrancheVisibility()">
                    </div>
                    <div class="form-group hidden" id="tr6Field">
                        <label id="t6" for="tr6" >Tranche 6:</label>
                        <input type="text" id="tr6" name="tr6" class="form-control" oninput="updateTrancheVisibility()">
                    </div>
                    <div class="form-group hidden" id="tr7Field">
                        <label id="t7" for="tr7">Tranche 7:</label>
                        <input type="text" id="tr7" name="tr7" class="form-control" oninput="updateTrancheVisibility()">
                    </div>
                    <div class="form-group hidden" id="tr8Field">
                        <label id="t8" for="tr8">Tranche 8:</label>
                        <input type="text" id="tr8" name="tr8" class="form-control" oninput="updateTrancheVisibility()">
                    </div>
                    <div class="form-group hidden" id="tr9Field">
                        <label id="t9" for="tr9">Tranche 9:</label>
                        <input type="text" id="tr9" name="tr9" class="form-control" oninput="updateTrancheVisibility()">
                    </div>
                    <div class="form-group hidden" id="tr10Field">
                        <label id="t10" for="tr10">Tranche 10:</label>
                        <input type="text" id="tr10" name="tr10" class="form-control" oninput="updateTrancheVisibility()">
                    </div>
                 
	                <div class="tranche-container" id="trancheContainer"></div>
	                	<button type="button" class="btn btn-outline-primary" id="addTrancheButton">Ajouter une nouvelle tranche</button>                  
	                </div>
                <br>		            
                <div class="form-group">
					    <span id="errorMsg" class="error hidden">La somme des tranches plus avance depasse le montant restant!</span>
					</div>
            </div>

            <button type="submit" id="payButton" class="hidden btn btn-primary">Save</button>
        </div>
    </form>
</div>
    <script th:inline="javascript">
        var articles = /*[[${articles}]]*/ [];
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const montantRestant = document.getElementById('montant');
        const paymentMode = document.getElementById('modePayment');
        const faciliteSection = document.getElementById('faciliteSection');
        const trancheContainer = document.getElementById('trancheContainer');
        const payButton = document.getElementById('payButton');
        const errorMsg = document.getElementById('errorMsg');
        const avance = document.getElementById('avance');
        const tranches = [
            document.getElementById('tr1'),
            document.getElementById('tr2'),
            document.getElementById('tr3'),
            document.getElementById('tr4'),
            document.getElementById('tr5'),
            document.getElementById('tr6'),
            document.getElementById('tr7'),
            document.getElementById('tr8'),
            document.getElementById('tr9'),
            document.getElementById('tr10')
        ];
        const labels = [
            document.getElementById('tr1Field'),
            document.getElementById('tr2Field'),
            document.getElementById('tr3Field'),
            document.getElementById('tr4Field'),
            document.getElementById('tr5Field'),
            document.getElementById('tr6Field'),
            document.getElementById('tr7Field'),
            document.getElementById('tr8Field'),
            document.getElementById('tr9Field'),
            document.getElementById('tr10Field')
        ];
        let trancheCount = 0;

        function calculateMontant() {
            var quantite = document.getElementById('quantite').value;
            var articleId = document.getElementById('article').value;
            var modePayment = document.getElementById('modePayment').value;
            var montant = 0;

            document.getElementById('error-message').style.display = 'none';
            
            if (quantite && articleId) {
                var article = articles.find(a => a.id == articleId);
                if (article) {
                    if (parseInt(quantite) > article.quantite) {
                        document.getElementById('error-message').innerText = 
                            'Quantity should be lower than the quantity in stock (' + article.quantite + ')';
                        document.getElementById('error-message').style.display = 'block';
                        document.getElementById('montant').value = '';
                        return;
                    }
                    montant = article.prixVente * quantite;
                    if (modePayment === 'facilite') {
                        montant *= 1.15;
                        document.getElementById('facilite-note').style.display = 'inline';
                        faciliteSection.classList.remove('hidden');
                    } else {
                        document.getElementById('facilite-note').style.display = 'none';
                        faciliteSection.classList.add('hidden');
                    }
                }
            }
            document.getElementById('montant').value = montant.toFixed(2);
            updateTrancheVisibility();
        }

        function updateTrancheVisibility() {
            let montant = parseFloat(document.getElementById('montant').value);
            let avanceVal = parseFloat(avance.value) || 0;
            let sumTranches = avanceVal;
            let showError = false;
            
            for (let i = 0; i < tranches.length; i++) {
                let trancheVal = parseFloat(tranches[i].value) || 0;
                sumTranches += trancheVal;

                if (sumTranches > montant) {
                    showError = true;
                }                   
            }
            errorMsg.classList.toggle('hidden', !showError);
            if (!showError && (sumTranches >= montant || paymentMode.value === 'comptant')) {
                payButton.classList.remove('hidden');
                addTrancheButton.classList.add('hidden');
            } else {
                payButton.classList.add('hidden');
                addTrancheButton.classList.toggle('hidden', showError);
            }
        }

        addTrancheButton.addEventListener('click', function() {
            if (trancheCount < tranches.length && errorMsg.classList.contains('hidden')) {
                if (trancheCount === 0 || parseFloat(tranches[trancheCount - 1].value) > 0) {
                    tranches[trancheCount].classList.remove('hidden');
                    labels[trancheCount].classList.remove('hidden');
                    trancheCount++;
                }
            }
        });

        document.getElementById('article').addEventListener('change', calculateMontant);
        document.getElementById('quantite').addEventListener('input', calculateMontant);
        document.getElementById('modePayment').addEventListener('change', calculateMontant);
        avance.addEventListener('input', updateTrancheVisibility);
        tranches.forEach(tranche => tranche.addEventListener('input', updateTrancheVisibility));
    });

    </script>
</body>
</html>
