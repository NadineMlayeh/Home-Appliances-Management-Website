<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Liste des clients</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
	    body{
	    background: url('bb.png') no-repeat;
	        background-size: cover; /* Ensure the image covers the entire body */
	    background-repeat: no-repeat; /* Prevent the image from repeating */
	    background-position: center;
	    }
        *{

            font-family: "Poppins", sans-serif;
        }
        .card-header {
            background-color: #e9ecef; /* Red background for the card header */
            color: #000; /* Black text color */
            text-align: center; /* Center align text */
            font-weight: bold; /* Make the text bold */
            font-size: 1.75rem; /* Slightly bigger text */
            padding: 1rem; /* Add padding */
            border: 1px solid black;
        }
		.card {
		    background-color: rgba(255, 255, 255, 0.37); /* White background with 50% opacity */
		}

        .table {
            background-color: #e9ecef; 
            border: 1px solid black;/* Grey background for the table container */
        }

        .table th, .table td {
            vertical-align: middle; /* Center align text vertically */
        }
                .table thead th {
            border-bottom: 2px solid black; /* Thicker border for table header */
        }
                .table tbody td {
            border-bottom: 1px solid black; /* Thicker border for table rows */
        }
        .table th, .table td {
            border: 1px solid black; /* Thicker border for table cells */
            vertical-align: middle; /* Center align text vertically */
        }

        .btn {
            border-radius: 0.25rem; /* Rounded corners */
            font-size: 0.875rem; /* Smaller font size */
        }

        .btn-success {
            background-color: #28a745;
            border: 1px solid #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        .btn-danger {
            background-color: #dc3545;
            border: 1px solid #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }

        .btn-warning {
            background-color: #ffc107;
            border: 1px solid #ffc107;
        }

        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }

        .btn-info {
            background-color: #17a2b8;
            border: 1px solid #17a2b8;
        }

        .btn-info:hover {
            background-color: #138496;
            border-color: #117a8b;
        }

        .pagination .page-item.active .page-link {
            background-color: #007bff; /* Active page link background */
            border-color: #007bff; /* Active page link border */
            color: #fff; /* Active page link text color */
        }

        .pagination .page-link {
            border-radius: 0.25rem; /* Rounded pagination links */
        }
        .input{
        border: 3px solid black;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">Liste des clients</div>
            <div class="card-body">
                <form method="get" th:action="@{/ListClients}">
                    <div class="form-group">
                        <label for="keyword"><b>Nom :</b></label>
                        <input type="text" id="keyword" name="keyword" th:value="${keyword}" class="form-control" style="border: 2px solid black; border-radius: 0.25rem;"/>

                    </div>
                    <button class="btn btn-success">Chercher</button>
                </form>
                <table class="table mt-3 table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Prenom</th>
                            <th>Date de Naissance</th>
                            <th>Adresse</th>
                            <th>Numero de telephone</th>
                            <th colspan="3" class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${ListClients}">
                            <td th:text="${c.id}"></td>
                            <td th:text="${c.nom}"></td>
                            <td th:text="${c.prenom}"></td>
                            <td th:text="${c.dateNaissance}"></td>
                            <td th:text="${c.adresse}"></td>
                            <td th:text="${c.numTelephone}"></td>
                            <td>
                                <a onclick="return confirm('Etes-vous sur de vouloir supprimer cet article ?')" class="btn btn-danger btn-sm" th:href="@{/deleteClient(id=${c.id})}">Effacer</a>
                            </td>
                            <td>
                                <a class="btn btn-warning btn-sm" th:href="@{/editClient(id=${c.id})}">Modifier</a>
                            </td>
                            <td>
                                <a class="btn btn-info btn-sm" th:href="@{/listAchatsByClient(clientId=${c.id})}">Afficher liste achats</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <nav>
                    <ul class="pagination justify-content-center mt-4">
                        <li th:each="page, status : ${pages}" class="page-item" th:classappend="${status.index == currentpage ? ' active' : ''}">
                            <a class="page-link" th:href="@{/ListClients(page=${status.index}, keyword=${keyword})}" th:text="${status.index + 1}"></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
