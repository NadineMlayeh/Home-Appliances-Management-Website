<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Liste des clients</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="stylesheet" href="/assets/css/admin-header.css">
    <style>
	    body{
	        background-image: url('/img/fr.png');
	        background-size: cover;
	        background-repeat: no-repeat;
	        background-position: center;
	        background-attachment: fixed;
	        padding-top: 74px;
	    }
        *{

            font-family: "Poppins", sans-serif;
        }
        .card-header {
            background-color: #2b3a4a;
            color: #fff;
            text-align: center;
            font-weight: 600;
            font-size: 1.4rem;
            padding: 16px 20px;
            border: none;
            border-radius: 10px 10px 0 0;
        }
		.card {
		    background-color: #ffffff;
		    border: none;
		    border-radius: 10px;
		    box-shadow: 0 8px 24px rgba(15, 44, 89, 0.14);
		}

        .table {
            background-color: #fff;
            border: 1px solid #e6ebf1;
            border-radius: 8px;
            overflow: hidden;
        }

        .table th, .table td {
            vertical-align: middle;
            padding: 12px 14px;
        }
        .table thead th {
            background-color: #f2f6fb;
            color: #44546a;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid #dfe7f0;
            white-space: nowrap;
        }
        .table tbody td {
            border-bottom: 1px solid #edf1f6;
        }
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        .table tbody tr {
            transition: background-color 0.15s ease;
        }
        .table tbody tr:hover {
            background-color: #f4f8ff;
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #fafcff;
        }

        .btn {
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .btn-success {
            background-color: #28a745;
            border: 1px solid #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        .btn-danger {
            background-color: #dc3545;
            border: 1px solid #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }

        .btn-warning {
            background-color: #ffc107;
            border: 1px solid #ffc107;
        }

        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }

        .btn-info {
            background-color: #17a2b8;
            border: 1px solid #17a2b8;
        }

        .btn-info:hover {
            background-color: #138496;
            border-color: #117a8b;
        }

        .pagination .page-item.active .page-link {
            background-color: #007bff; /* Active page link background */
            border-color: #007bff; /* Active page link border */
            color: #fff; /* Active page link text color */
        }

        .pagination .page-link {
            border-radius: 0.25rem; /* Rounded pagination links */
        }
        .input{
        border: 1px solid #ced4da;
        border-radius: 8px;
        }
        .search-form {
            background-color: #f8fafc;
            border: 1px solid #e6ebf1;
            border-radius: 8px;
            padding: 14px 16px;
        }
        .search-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/adminheader :: adminheadernav('clients')}"></div>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">Liste des clients</div>
            <div class="card-body">
                <form method="get" th:action="@{/ListClients}" class="search-form">
                    <div class="form-group mb-0">
                        <label for="keyword"><b>Nom :</b></label>
                        <div class="search-row">
                            <input type="text" id="keyword" name="keyword" th:value="${keyword}" class="form-control" style="flex: 1;"/>
                            <button class="btn btn-success">Chercher</button>
                        </div>
                    </div>
                </form>
                <table class="table mt-3 table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Prenom</th>
                            <th>Date de Naissance</th>
                            <th>Adresse</th>
                            <th>Numero de telephone</th>
                            <th colspan="3" class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${ListClients}">
                            <td th:text="${c.id}"></td>
                            <td th:text="${c.nom}"></td>
                            <td th:text="${c.prenom}"></td>
                            <td th:text="${c.dateNaissance != null ? #dates.format(c.dateNaissance, 'dd-MM-yyyy') : '-'}"></td>
                            <td th:text="${c.adresse}"></td>
                            <td th:text="${c.numTelephone}"></td>
                            <td>
                                <a data-confirm="Etes-vous sur de vouloir supprimer ce client ?" class="btn btn-danger btn-sm" th:href="@{/deleteClient(id=${c.id})}"><i class="fas fa-trash-alt"></i> Effacer</a>
                            </td>
                            <td>
                                <a class="btn btn-warning btn-sm" th:href="@{/editClient(id=${c.id})}"><i class="fas fa-pen"></i> Modifier</a>
                            </td>
                            <td>
                                <a class="btn btn-info btn-sm" th:href="@{/listAchatsByClient(clientId=${c.id})}"><i class="fas fa-list"></i> Achats</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="text-center py-4 text-muted" th:if="${ListClients == null || ListClients.isEmpty()}">
                    <i class="fas fa-users-slash fa-3x mb-3" style="color: #cbd5e1;"></i>
                    <p class="mb-0">Aucun client trouvé.</p>
                </div>
                <nav th:if="${pages != null && pages.length > 1}">
                    <ul class="pagination justify-content-center mt-4">
                        <li th:each="page, status : ${pages}" class="page-item" th:classappend="${status.index == currentpage ? ' active' : ''}">
                            <a class="page-link" th:href="@{/ListClients(page=${status.index}, keyword=${keyword})}" th:text="${status.index + 1}"></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
