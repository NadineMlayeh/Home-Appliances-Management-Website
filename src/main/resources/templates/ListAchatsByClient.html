<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Achats pour Client</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/admin-header.css">
    <style>
	    body{
	        background-image: url('/img/fr.png');
	        background-size: cover;
	        background-repeat: no-repeat;
	        background-position: center;
	        background-attachment: fixed;
	        padding-top: 74px;
	    }
	    *{
            font-family: "Poppins", sans-serif;
        }

        .container {
            margin-top: 90px;
        }

        .card-header {
            background-color: #2b3a4a;
            color: #fff;
            text-align: center;
            font-weight: 600;
            font-size: 1.4rem;
            padding: 16px 20px;
            border: none;
            border-radius: 10px 10px 0 0;
        }
        .card-body {
            background-color: #ffffff;
        }
        .card {
            background-color: #ffffff;
            border: none;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(15, 44, 89, 0.14);
            overflow: hidden;
        }

        .table {
            background-color: #fff;
            margin-bottom: 0;
        }

        .table th, .table td {
            vertical-align: middle;
            padding: 12px 14px;
        }
        .table thead th {
            background-color: #f2f6fb;
            color: #44546a;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid #dfe7f0;
            white-space: nowrap;
        }
        .table tbody td {
            border-bottom: 1px solid #edf1f6;
        }
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        .table tbody tr {
            transition: background-color 0.15s ease;
        }
        .table tbody tr:hover {
            background-color: #f4f8ff;
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #fafcff;
        }

        .badge-payment {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-comptant {
            background-color: #e6f7ee;
            color: #1a9d5a;
            border: 1px solid #bfe9d3;
        }
        .badge-facilite {
            background-color: #eef3ff;
            color: #2f6fe0;
            border: 1px solid #cddbf8;
        }

        .table-responsive {
            border: 1px solid #e6ebf1;
            border-radius: 8px;
        }

        .pagination {
            justify-content: center;
            margin-top: 20px;
        }

        .page-item.active .page-link {
            background-color: #007bff;
            border-color: #007bff;
            color: white;
        }

        .page-link {
            color: #007bff;
            border-radius: 8px;
            margin: 0 3px;
        }

        .page-link:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/adminheader :: adminheadernav('clients')}"></div>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">Liste des achats - <span th:text="${client.nom}">Client</span></div>
            <div class="card-body">
                <div class="table-responsive">
                <table class="table table-striped mt-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Article</th>
                            <th>Date d'Achat</th>
                            <th>Quantite</th>
                            <th>Montant</th>
                            <th>Mode de Paiement</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="achat : ${ListAchats}">
                            <td th:text="${achat.id}"></td>
                            <td th:text="${achat.article != null ? achat.article.name : '-'}"></td>
                            <td th:text="${achat.dateAchat != null ? #dates.format(achat.dateAchat, 'dd-MM-yyyy') : '-'}"></td>
                            <td th:text="${achat.quantite}"></td>
                            <td><b th:text="${achat.montant != null ? #numbers.formatDecimal(achat.montant, 1, 2) + ' TND' : '-'}"></b></td>
                            <td>
                                <span class="badge badge-payment" 
                                      th:classappend="${achat.modePayment == 'comptant'} ? 'badge-comptant' : 'badge-facilite'"
                                      th:text="${achat.modePayment == 'comptant'} ? 'Comptant' : 'Facilité'"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
                <div class="text-center py-4 text-muted" th:if="${ListAchats == null || ListAchats.isEmpty()}">
                    <i class="fas fa-shopping-bag fa-3x mb-3" style="color: #cbd5e1;"></i>
                    <p class="mb-0">Aucun achat trouvé pour ce client.</p>
                </div>
                <nav th:if="${pages != null && pages.length > 1}">
                    <ul class="pagination">
                        <li th:each="page, status : ${pages}" class="page-item" th:classappend="${status.index == currentpage ? ' active' : ''}">
                            <a class="page-link" th:href="@{/listAchatsByClient(clientId=${client.id}, page=${status.index})}" th:text="${status.index + 1}"></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
