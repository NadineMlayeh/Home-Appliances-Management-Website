<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Achats pour Client</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
	    body{
	    background: url('img2.png') no-repeat;
	    background-size: cover; /* Ensure the image covers the entire body */
	    background-repeat: no-repeat; /* Prevent the image from repeating */
	    background-position: center;
	    }
	    *{
            font-family: "Poppins", sans-serif;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2rem;
            color: #343a40;
            margin-bottom: 20px;
            text-align: center; /* Center align the heading */
            font-weight: bold;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1rem;
            color: #212529;
        }

        .table th,
        .table td {
            padding: 12px;
            text-align: left;
            border-top: 1px solid #dee2e6;
            vertical-align: middle;
        }

        .table th {
            background-color: #007bff;
            color: white;
        }
        .table th, .table td {
            vertical-align: middle; /* Center align text vertically */
        }
                .table thead th {
            border-bottom: 2px solid black; /* Thicker border for table header */
        }
                .table tbody td {
            border-bottom: 1px solid black; /* Thicker border for table rows */
        }
        .table th, .table td {
            border: 1px solid black; /* Thicker border for table cells */
            vertical-align: middle; /* Center align text vertically */
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(0, 123, 255, 0.05); /* Light blue stripe */
        }

        .pagination {
            justify-content: center;
        }

        .page-item.active .page-link {
            background-color: #007bff;
            border-color: #007bff;
            color: white;
        }

        .page-link {
            color: #007bff;
        }

        .page-link:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Liste des Achats pour <span th:text="${client.nom}">Client</span></h1>
        <table class="table table-striped table-bordered mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Article</th>
                    <th>Date d'Achat</th>
                    <th>Quantite</th>
                    <th>Montant</th>
                    <th>Mode de Paiement</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="achat : ${ListAchats}">
                    <td th:text="${achat.id}"></td>
                    <td th:text="${achat.article.name}"></td>
                    <td th:text="${achat.dateAchat}"></td>
                    <td th:text="${achat.quantite}"></td>
                    <td th:text="${achat.montant}"></td>
                    <td th:text="${achat.modePayment}"></td>
                </tr>
            </tbody>
        </table>
        <nav>
            <ul class="pagination">
                <li th:each="page, status : ${pages}" class="page-item" th:classappend="${status.index == currentpage ? ' active' : ''}">
                    <a class="page-link" th:href="@{/listAchatsByClient(clientId=${client.id}, page=${status.index})}" th:text="${status.index + 1}"></a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
