<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Article</title>
    
    <script type="text/javascript">
        function calculateFields() {
            var prixUnitaire = parseFloat(document.getElementById("prixUnitaire").value) || 0;
            var benefice = parseFloat(document.getElementById("benefice").value) || 0;
            var taxeTVA = prixUnitaire * 0.20;
            var prixVente = prixUnitaire + taxeTVA + benefice;

            document.getElementById("taxeTVA").value = taxeTVA.toFixed(2);
            document.getElementById("prixVente").value = prixVente.toFixed(2);
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        @import url("https://fonts.googleapis.com/css?family=Poppins:wght@300,400,500,600,700,900");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('1.png') no-repeat;
            background-size: cover;
            background-position: center;
        }
        
        .wrapper {
            width: 750px;
            background: rgba(247, 245, 245, 0.1);
            border: 2px solid rgba(255, 255, 255, .2);
            box-shadow: 0 0 10px rgba(0, 0, 0, .2);
            backdrop-filter: blur(70px);
            border-radius: 10px;
            color: #fff;
            padding: 40px 35px 55px;
            margin: 0 10px;
        }
        
        .wrapper h1 {
            font-size: 36px;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-box {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .input-box .input-field {
            position: relative;
            width: 48%;
            height: 50px;
            margin: 13px 0;
        }

        .input-box .input-field.full-width {
            width: 100%;
            margin: 20px auto;
        }

        .input-box .input-field input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.792);
            outline: none;
            font-size: 16px;
            color: #000000;
            border-radius: 6px;
            padding: 15px 15px 15px 40px;
            transition: all 0.3s ease;
        }

        .input-box .input-field input:focus {
            border-color: #423f3f; /* Change the border color on focus */
            box-shadow: 0 0 8px #ffffff; /* Add a glow effect */
            background: rgba(255, 255, 255, .2); /* Slightly change the background on focus */
        }

        .input-box .input-field input::placeholder {
            color: transparent; /* Hide the placeholder text */
        }

        .input-box .input-field label {
            position: absolute;
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            color: #000000;
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .input-box .input-field i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #fff;
            transition: all 0.3s ease;
        }

        .input-box .input-field input:focus + label,
        .input-box .input-field input:not(:placeholder-shown) + label {
            top: -15px;
            font-size: 12px;
            color: #383535; /* Change the label color on focus */
        }

        .input-box .input-field input:focus ~ i,
        .input-box .input-field input:not(:placeholder-shown) ~ i {
            top: -15px;
            font-size: 12px;
            color: #0e0e0e; /* Change the icon color on focus */
        }


        .btn {
            width: 100%;
            height: 45px;
            background: #fff;
            border: 2px solid #fff; /* Border width, style, and color */
            outline: none;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            font-size: 16px;
            color: #333;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: black;
            color:white;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.7); /* Intense lightning effect */
        }
        @media (max-width: 576px) {
            .input-box .input-field {
                width: 100%;
                margin: 10px 0;
            }
        }
		        h1 {
		    font-size: 2.5rem;
		    color: #000; /* Set the text color to black */
		    text-shadow: 
		        0 0 5px rgba(255, 255, 255, 1),
		        0 0 10px rgba(255, 255, 255, 1),
		        0 0 15px rgba(255, 255, 255, 1),
		        0 0 20px rgba(255, 255, 255, 1),
		        0 0 25px rgba(255, 255, 255, 1),
		        0 0 30px rgba(255, 255, 255, 1),
		        0 0 35px rgba(255, 255, 255, 1); /* Stronger white glow with more layers */
		    transition: text-shadow 0.3s;
		}

        h1:hover {
            text-shadow: 0 0 20px rgba(243, 235, 235, 0.9); /* Red glow on hover */
        }

    </style>
</head>
<body>
	<div class="wrapper">  
    <form action="#" th:action="@{/saveArticle}" th:object="${article}" method="post">
    <h1>Ajouter Article</h1>
    <div class="input-box">
        <div>
            <input type="hidden" th:field="*{id}" />
        </div>
       <div class="input-field full-width">
            <input type="text" id="nom" th:field="*{name}" required placeholder=" ">
            <label for="nom">Nom </label>
            <i class='bx bxs-user'></i>
       </div>
       <div class="input-field full-width">
        <input type="number" id="prixUnitaire" th:field="*{prixUnitaire}" required placeholder=" " step="0.01" oninput="calculateFields()">
        <label for="prixUnitaire">Prix Unitaire</label>
        <i class='bx bxs-dollar-circle'></i> <!-- Icon for price -->
    </div>          
    <div class="input-field full-width">
        <input type="number" id="benefice" th:field="*{benefice}" required placeholder=" " step="0.01" oninput="calculateFields()">
        <label for="benefice">Benefice</label>
        <i class='bx bxs-chart'></i> <!-- Icon for profit/benefit -->
    </div>
    <div class="input-field full-width">
        <input type="number" id="taxeTVA" th:field="*{taxeTVA}" required step="0.01" readonly  placeholder=" " >
        <label for="taxeTVA">Taxe TVA</label>
        <i class='bx bx-trending-up'></i> <!-- Icon for tax percentage -->
    </div>    
    <div class="input-field full-width">
        <input type="number" id="prixVente" th:field="*{prixVente}" required step="0.01" readonly placeholder=" ">
        <label for="prixVente">Prix Vente</label>
        <i class='bx bxs-cart'></i> <!-- Icon for sale price -->
    </div> 
    
    <div class="input-field full-width">
        <input type="number" id="quantite" th:field="*{quantite}" required placeholder=" ">
        <label for="quantite">Quantite</label>
        <i class='bx bxs-box'></i> <!-- Icon for quantity -->
    </div> 
      <button class="btn" type="submit" >Enregistrer</button>
    </div>
    </form>
    </div>
</body>
</html>
