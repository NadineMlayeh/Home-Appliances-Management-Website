<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Poppins:200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i&display=swap" rel="stylesheet">
    <title>Liste des messages</title>
    <style>
			body {
			    font-family: "Poppins", sans-serif;
			    background-color: rgba(145, 141, 141, 0.847);;
			    margin: 0;
			    padding: 20px;
			}

        .header {
            background-color: #000;
            color: #fff;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 
		        0 0 15px rgba(33, 150, 243, 0.9), /* Blue glow */
		        0 0 30px rgba(33, 150, 243, 0.7), 
		        0 0 45px rgba(33, 150, 243, 0.5); /* Blue glow */
            margin-bottom: 20px;
        }
        .header img {
            max-height: 50px;
            margin-right: 20px;
        }
        h1 {
            font-size: 2em;
            margin: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #2196F3; /* Light blue */
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #ddd;
        }
        tr:nth-child(odd) {
            background-color: #e3f2fd; /* Very light blue for odd rows */
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Liste des avis</h1>
    </div>
    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>Message</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loop through the notes in the model and display them -->
            <tr th:each="note : ${notes}">
                <td th:text="${note.nom}"></td>
                <td th:text="${note.email}"></td>
                <td th:text="${note.message}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
