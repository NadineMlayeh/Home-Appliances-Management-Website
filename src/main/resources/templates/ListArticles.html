<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Liste des articles</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
        <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
	    body{
	    background: url('img2.png') no-repeat;
	    background-size: cover; /* Ensure the image covers the entire body */
	    background-repeat: no-repeat; /* Prevent the image from repeating */
	    background-position: center;
	    }
        *{

            font-family: "Poppins", sans-serif;
        }
        .card-header {
            background-color: #e9ecef; /* Red background for the card header */
            color: #000; /* Black text color */
            text-align: center; /* Center align text */
            font-weight: bold; /* Make the text bold */
            font-size: 1.75rem; /* Slightly bigger text */
            padding: 1rem; /* Add padding */
            border: 1px solid black;
        }
		.card {
		    background-color: rgba(255, 255, 255, 0.37); /* White background with 50% opacity */
		}

        .table {
            background-color: #e9ecef; 
            border: 1px solid black;/* Grey background for the table container */
        }

        .table th, .table td {
            vertical-align: middle; /* Center align text vertically */
        }
                .table thead th {
            border-bottom: 2px solid black; /* Thicker border for table header */
        }
                .table tbody td {
            border-bottom: 1px solid black; /* Thicker border for table rows */
        }
        .table th, .table td {
            border: 1px solid black; /* Thicker border for table cells */
            vertical-align: middle; /* Center align text vertically */
        }

        .btn {
            border-radius: 0.25rem; /* Rounded corners */
            font-size: 0.875rem; /* Smaller font size */
        }

        .btn-success {
            background-color: #28a745;
            border: 1px solid #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        .btn-danger {
            background-color: #dc3545;
            border: 1px solid #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }

        .btn-warning {
            background-color: #ffc107;
            border: 1px solid #ffc107;
        }

        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }

        .btn-info {
            background-color: #17a2b8;
            border: 1px solid #17a2b8;
        }

        .btn-info:hover {
            background-color: #138496;
            border-color: #117a8b;
        }

        .pagination .page-item.active .page-link {
            background-color: #007bff; /* Active page link background */
            border-color: #007bff; /* Active page link border */
            color: #fff; /* Active page link text color */
        }

        .pagination .page-link {
            border-radius: 0.25rem; /* Rounded pagination links */
        }
        .input{
        border: 3px solid black;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">Liste des articles</div>
            <div class="card-body">
                <form method="get" th:action="@{/ListArticles}">
                    <div class="form-group">
                        <label><b>Nom :</b></label>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control" style="border: 2px solid black; border-radius: 0.25rem;"/>
                    </div>
                    <button class="btn btn-success">Chercher</button>
                </form>
                <table class="table mt-3">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Designation</th>
                            <th>Prix Unitaire H.T</th>
                            <th>Taxe TVA</th>
                            <th>Benefice</th>
                            <th>Prix de Vente</th>
                            <th>Quantite</th>
                            <th colspan="3" class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${ListArticles}">
                            <td th:text="${a.id}"></td>
                            <td th:text="${a.name}"></td>
                            <td th:text="${a.prixUnitaire}"></td>
                            <td th:text="${a.taxeTVA}"></td>
                            <td th:text="${a.benefice}"></td>
                            <td th:text="${a.prixVente}"></td>
                            <td th:text="${a.quantite}"></td>
                            <td>
                                <a onclick="return confirm('Etes-vous sur de vouloir supprimer cet article ?')" class="btn btn-danger" th:href="@{/deleteArticle(id=${a.id})}">Effacer</a>
                            </td> 
                            <td> 
                              <a class="btn btn-warning" th:href="@{/editArticle(id=${a.id})}">Modifier</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <ul class="pagination justify-content-center mt-4">
                    <li th:each="page, status : ${pages}" class="page-item" th:classappend="${status.index == currentpage ? 'active' : ''}">
                        <a class="page-link" th:href="@{/ListArticles(page=${status.index}, keyword=${keyword})}" th:text="${status.index}"></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
