<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Liste des articles</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
        <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="stylesheet" href="/assets/css/admin-header.css">
    <style>
	    body{
	    background: url('img2.png') no-repeat;
	    background-size: cover; /* Ensure the image covers the entire body */
	    background-repeat: no-repeat; /* Prevent the image from repeating */
	    background-position: center;
	    padding-top: 74px; /* clear the fixed admin header */
	    }
        *{

            font-family: "Poppins", sans-serif;
        }
        .card-header {
            background-color: #2b3a4a;
            color: #fff;
            text-align: center;
            font-weight: 600;
            font-size: 1.4rem;
            padding: 16px 20px;
            border: none;
            border-radius: 10px 10px 0 0;
        }
		.card {
		    background-color: #ffffff;
		    border: none;
		    border-radius: 10px;
		    box-shadow: 0 8px 24px rgba(15, 44, 89, 0.14);
		}

        .table {
            background-color: #fff;
            border: 1px solid #e6ebf1;
            border-radius: 8px;
            overflow: hidden;
        }

        .table th, .table td {
            vertical-align: middle;
            padding: 12px 14px;
        }
        .table thead th {
            background-color: #f2f6fb;
            color: #44546a;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid #dfe7f0;
            white-space: nowrap;
        }
        .table tbody td {
            border-bottom: 1px solid #edf1f6;
        }
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        .table tbody tr {
            transition: background-color 0.15s ease;
        }
        .table tbody tr:hover {
            background-color: #f4f8ff;
        }

        .btn {
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .btn-success {
            background-color: #28a745;
            border: 1px solid #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        .btn-danger {
            background-color: #dc3545;
            border: 1px solid #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }

        .btn-warning {
            background-color: #ffc107;
            border: 1px solid #ffc107;
        }

        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }

        .btn-info {
            background-color: #17a2b8;
            border: 1px solid #17a2b8;
        }

        .btn-info:hover {
            background-color: #138496;
            border-color: #117a8b;
        }

        .pagination .page-item.active .page-link {
            background-color: #007bff; /* Active page link background */
            border-color: #007bff; /* Active page link border */
            color: #fff; /* Active page link text color */
        }

        .pagination .page-link {
            border-radius: 0.25rem; /* Rounded pagination links */
        }
        .input{
        border: 1px solid #ced4da;
        border-radius: 8px;
        }
        .search-form {
            background-color: #f8fafc;
            border: 1px solid #e6ebf1;
            border-radius: 8px;
            padding: 14px 16px;
        }
        .search-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/adminheader :: adminheadernav('articles')}"></div>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">Liste des articles</div>
            <div class="card-body">
                <form method="get" th:action="@{/ListArticles}" class="search-form">
                    <div class="form-group mb-0">
                        <label><b>Nom :</b></label>
                        <div class="search-row">
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control" style="flex: 1;"/>
                            <button class="btn btn-success">Chercher</button>
                        </div>
                    </div>
                </form>
                <table class="table mt-3">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Designation</th>
                            <th>Prix Unitaire H.T</th>
                            <th>Taxe TVA</th>
                            <th>Benefice</th>
                            <th>Prix de Vente</th>
                            <th>Quantite</th>
                            <th colspan="3" class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${ListArticles}">
                            <td th:text="${a.id}"></td>
                            <td th:text="${a.name}"></td>
                            <td th:text="${a.prixUnitaire}"></td>
                            <td th:text="${a.taxeTVA}"></td>
                            <td th:text="${a.benefice}"></td>
                            <td th:text="${a.prixVente}"></td>
                            <td th:text="${a.quantite}"></td>
                            <td>
                                <a onclick="return confirm('Etes-vous sur de vouloir supprimer cet article ?')" class="btn btn-danger" th:href="@{/deleteArticle(id=${a.id})}"><i class="fas fa-trash-alt"></i> Effacer</a>
                            </td> 
                            <td> 
                              <a class="btn btn-warning" th:href="@{/editArticle(id=${a.id})}"><i class="fas fa-pen"></i> Modifier</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <ul class="pagination justify-content-center mt-4">
                    <li th:each="page, status : ${pages}" class="page-item" th:classappend="${status.index == currentpage ? 'active' : ''}">
                        <a class="page-link" th:href="@{/ListArticles(page=${status.index}, keyword=${keyword})}" th:text="${status.index}"></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
