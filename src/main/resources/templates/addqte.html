<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adjust Quantity</title>
    <!-- Font Awesome and Boxicons for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:wght@300,400,500,600,700,900" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('back2.png') no-repeat;
            background-size: cover;
            background-position: center;
        }

        .wrapper {
            width: 500px;
            background: rgba(255, 255, 255, 0.9);
            background-color:#d8d4d4;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .wrapper h1 {
            font-size: 2.5rem;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-field {
            position: relative;
            margin-bottom: 20px;
        }

        .input-field input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: #fff;
            transition: all 0.3s ease;
        }

        .input-field input:focus {
            border-color: #308dc0;
            box-shadow: 0 0 8px rgba(48, 141, 192, 0.5);
            outline: none;
        }

        .input-field label {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: #888;
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .input-field input:focus + label,
        .input-field input:not(:placeholder-shown) + label {
            top: -15px;
            left: 15px;
            font-size: 12px;
            color: #308dc0;
        }

        .input-field i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            font-size: 20px;
            color: #ddd;
            transition: all 0.3s ease;
        }

        .input-field input:focus ~ i {
            color: #308dc0;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #308dc0;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            background-color:white;
            color: #308dc0;
            box-shadow: 0 0 15px rgba(48, 141, 192, 0.5);
        }

        a {

            color: black;

        }

        .btn-back:hover {
            background-color:white;
            color: #e9ecef;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        span{
        color:#d8d4d4;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Adjust Quantity</h1>
        <form th:action="@{/updateQuantity}" method="post">
            <input type="hidden" name="articleId" th:value="${article.id}"/>
            
            <div class="input-field">
                <input type="text" id="articleName" th:value="${article.name}" readonly/>
                <label for="articleName"><b>Nom article</b></label>
                
            </div><br>

            <div class="input-field">
                <input type="number" id="quantity" name="quantity" th:value="${article.quantite}" min="0"/>
                <label for="quantity"><b>Quantite actuelle</b></label>
                
            </div>
            <div>
            <button type="submit" class="btn">Enregistrer</button>
            </div><br>
            <div>
            <a href="#" onclick="window.history.back()"><i class="fas fa-arrow-left"><span>.</span></i>Back</a>
            </div>
        </form>
    </div>
</body>
</html>
