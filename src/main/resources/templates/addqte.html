<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier la quantité</title>
    <!-- Font Awesome and Boxicons for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:wght@300,400,500,600,700,900" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/admin-header.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('/img/fr.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-top: 70px; /* clear the fixed admin header */
        }

        .wrapper {
            width: 500px;
            background: rgba(255, 255, 255, 0.9);
            background-color: #ffffff;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(15, 44, 89, 0.16);
            border: 1px solid #e6ebf1;
        }

        .wrapper h1 {
            font-size: 1.6rem;
            color: #2b3a4a;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-field {
            position: relative;
            margin-bottom: 20px;
        }

        .input-field input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: #fff;
            transition: all 0.3s ease;
        }

        .input-field input:focus {
            border-color: #308dc0;
            box-shadow: 0 0 8px rgba(48, 141, 192, 0.5);
            outline: none;
        }

        .input-field label {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: #888;
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .input-field input:focus + label,
        .input-field input:not(:placeholder-shown) + label {
            top: -15px;
            left: 15px;
            font-size: 12px;
            color: #308dc0;
        }

        .input-field i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            font-size: 20px;
            color: #ddd;
            transition: all 0.3s ease;
        }

        .input-field input:focus ~ i {
            color: #308dc0;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #308dc0, #256e9c);
            border: none;
            border-radius: 9px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(48, 141, 192, 0.35);
            transition: background-color 0.3s, box-shadow 0.3s, transform 0.2s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #256e9c, #308dc0);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(48, 141, 192, 0.45);
        }

        a {

            color: #256e9c;

        }

        .btn-back:hover {
            background-color: #e6ebf1;
            color: #256e9c;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        span{
        color:#d8d4d4;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/adminheader :: adminheadernav('articles')}"></div>
    <div class="wrapper">
        <h1>Modifier la quantité</h1>
        <form th:action="@{/updateQuantity}" method="post">
            <input type="hidden" name="articleId" th:value="${article.id}"/>
            
            <div class="input-field">
                <input type="text" id="articleName" th:value="${article.name}" readonly/>
                <label for="articleName"><b>Nom de l'article</b></label>
                
            </div><br>

            <div class="input-field">
                <input type="number" id="quantity" name="quantity" th:value="${article.quantite}" min="0"/>
                <label for="quantity"><b>Quantité actuelle</b></label>
                
            </div>
            <div>
            <button type="submit" class="btn">Enregistrer</button>
            </div><br>
            <div>
            <a href="#" onclick="window.history.back()"><i class="fas fa-arrow-left"></i> Retour</a>
            </div>
        </form>
    </div>
</body>
</html>
