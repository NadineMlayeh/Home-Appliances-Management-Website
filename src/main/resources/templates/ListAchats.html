<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Liste des Achats</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
          <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.1.3/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="stylesheet" href="/assets/css/admin-header.css">
    <style>
	    body{
	        background-image: url('/img/fr.png');
	        background-size: cover;
	        background-repeat: no-repeat;
	        background-position: center;
	        background-attachment: fixed;
	        padding-top: 74px;
	    }
        *{

            font-family: "Poppins", sans-serif;
        }
        .card-header {
            background-color: #2b3a4a;
            color: #fff;
            text-align: center;
            font-weight: 600;
            font-size: 1.4rem;
            padding: 16px 20px;
            border: none;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
		.card {
		    background-color: #ffffff;
		    border: none;
		    border-radius: 10px;
		    box-shadow: 0 8px 24px rgba(15, 44, 89, 0.14);
		}

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .filter-label {
            color: #cfe0f0;
            font-size: 0.9rem;
            margin: 0;
        }
        .filter-select {
            width: 180px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            font-size: 0.9rem;
        }

        .table {
            background-color: #fff;
            margin-bottom: 0;
        }

        .table th, .table td {
            vertical-align: middle;
            padding: 12px 14px;
        }
        .table thead th {
            background-color: #f2f6fb;
            color: #44546a;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid #dfe7f0;
            white-space: nowrap;
        }
        .table tbody td {
            border-bottom: 1px solid #edf1f6;
        }
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        .table tbody tr {
            transition: background-color 0.15s ease;
        }
        .table tbody tr:hover {
            background-color: #f4f8ff;
        }

        .badge-payment {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-comptant {
            background-color: #e6f7ee;
            color: #1a9d5a;
            border: 1px solid #bfe9d3;
        }
        .badge-facilite {
            background-color: #eef3ff;
            color: #2f6fe0;
            border: 1px solid #cddbf8;
        }
        .badge-paid {
            background-color: #28a745;
            color: #fff;
        }
        .badge-encours {
            background-color: #ffc107;
            color: #7a5a00;
        }

        .btn-sm-action {
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            white-space: nowrap;
        }
        .action-cell {
            white-space: nowrap;
        }
        .action-cell .btn-sm-action {
            margin: 2px;
        }

        .table-responsive {
            border: 1px solid #e6ebf1;
            border-radius: 8px;
        }

        .btn {
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .btn-success {
            background-color: #28a745;
            border: 1px solid #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        .btn-danger {
            background-color: #dc3545;
            border: 1px solid #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }

        .btn-warning {
            background-color: #ffc107;
            border: 1px solid #ffc107;
        }

        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }

        .btn-info {
            background-color: #17a2b8;
            border: 1px solid #17a2b8;
        }

        .btn-info:hover {
            background-color: #138496;
            border-color: #117a8b;
        }

        .pagination .page-item.active .page-link {
            background-color: #007bff; /* Active page link background */
            border-color: #007bff; /* Active page link border */
            color: #fff; /* Active page link text color */
        }

        .pagination .page-link {
            border-radius: 0.25rem; /* Rounded pagination links */
        }
        .input{
        border: 1px solid #ced4da;
        border-radius: 8px;
        }        
        .btn-paid {
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/adminheader :: adminheadernav('achats')}"></div>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <span>Liste des Achats</span>
                <div class="filter-bar">
                    <label for="modeFilter" class="filter-label"><b>Mode de paiement :</b></label>
                    <select id="modeFilter" name="mode" class="form-control filter-select" onchange="location.href=this.value;">
                        <option value="/ListAchats" th:selected="${mode == null or mode == '' or mode == 'all'}">Tous</option>
                        <option value="/ListAchats?mode=comptant" th:selected="${mode == 'comptant'}">Comptant</option>
                        <option value="/ListAchats?mode=facilite" th:selected="${mode == 'facilite'}">Facilite</option>
                    </select>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                <table class="table mt-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Client</th>
                            <th>Article</th>
                            <th>Date d'Achat</th>
                            <th>Quantite</th>
                            <th>Montant</th>
                            <th>Mode de Paiement</th>
                            <th>Statut</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="achat : ${ListAchats}">
                            <td th:text="${achat.id}"></td>
                            <td th:text="${achat.client != null ? achat.client.nom + ' ' + (achat.client.prenom != null ? achat.client.prenom : '') : '-'}"></td>
                            <td th:text="${achat.article != null ? achat.article.name : '-'}"></td>
                            <td th:text="${achat.dateAchat != null ? #dates.format(achat.dateAchat, 'dd-MM-yyyy') : '-'}"></td>
                            <td th:text="${achat.quantite}"></td>
                            <td><b th:text="${achat.montant != null ? #numbers.formatDecimal(achat.montant, 1, 2) + ' TND' : '-'}"></b></td>
                            <td>
                                <span class="badge badge-payment" 
                                      th:classappend="${achat.modePayment == 'comptant'} ? 'badge-comptant' : 'badge-facilite'"
                                      th:text="${achat.modePayment == 'comptant'} ? 'Comptant' : 'Facilité'"></span>
                            </td>
                            <td>
                                <span th:if="${achat.montantRestant == 0}" class="badge badge-payment badge-paid">Payé</span>
                                <span th:if="${achat.montantRestant > 0}" class="badge badge-payment badge-encours">En cours</span>
                            </td>
                            <td class="text-center action-cell">
                                <a data-confirm="Etes-vous sur de vouloir supprimer cet achat ?" class="btn btn-danger btn-sm-action" th:href="@{/deleteAchat(id=${achat.id})}"><i class="fas fa-trash-alt"></i></a>
                                <a class="btn btn-success btn-sm-action" th:href="@{/editAchat(id=${achat.id})}"><i class="fas fa-pen"></i></a>
                                <a class="btn btn-warning btn-sm-action" th:href="@{/facture/{id}(id=${achat.id})}"><i class="fas fa-file-invoice"></i></a>
                                <span th:if="${achat.montantRestant == 0}" class="btn btn-paid btn-sm-action"><i class="fas fa-check"></i></span>
                                <a th:if="${achat.montantRestant > 0}" th:href="@{/payment/{id}(id=${achat.id})}" class="btn btn-primary btn-sm-action"><i class="fas fa-credit-card"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
                <div class="text-center py-4 text-muted" th:if="${ListAchats == null || ListAchats.isEmpty()}">
                    <i class="fas fa-shopping-cart fa-3x mb-3" style="color: #cbd5e1;"></i>
                    <p class="mb-0">Aucune vente enregistrée.</p>
                </div>
                <ul class="pagination justify-content-center mt-4" th:if="${pages != null && pages.length > 1}">
                    <li th:each="page, status : ${pages}" class="page-item" th:classappend="${status.index == currentpage ? 'active' : ''}">
                        <a class="page-link" th:href="@{/ListAchats(page=${status.index}, keyword=${keyword}, mode=${mode})}" th:text="${status.index + 1}"></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
