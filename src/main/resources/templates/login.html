<html>
    <head>        
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <style>
    @import url("https://fonts.googleapis.com/css?family=Poppins:wght@300,400,500,600,700,900");
        /* General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #23242a;
        }

        
        .box {
            position: relative;
            width: 380px;
            height: 420px;
            background: #1c1c1c;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .box::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 380px;
                height: 420px;
                background: linear-gradient(0deg, transparent, #45f3ff, #45f3ff,#45f3ff);
                z-index: 1;
                transform-origin: bottom right;
                animation: animate 6s linear infinite;
                }
        .box::after {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 380px;
                height: 420px;
                background: linear-gradient(0deg, transparent, #45f3ff, #45f3ff,#45f3ff);
                z-index: 1;
                transform-origin: bottom right;
                animation: animate 6s linear infinite;
                animation-delay: -3s;
                }
        
        .borderline::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 380px;
                height: 420px;
                background: linear-gradient(0deg, transparent, #ff2770, #ff2770, #ff2770);
                z-index: 1;
                transform-origin: bottom right;
                animation: animate 6s linear infinite;
                animation-delay: -1.5s;
                } 
                .borderline::after {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 380px;
                height: 420px;
                background: linear-gradient(0deg, transparent, #ff2770, #ff2770, #ff2770);
                z-index: 1;
                transform-origin: bottom right;
                animation: animate 6s linear infinite;
                animation-delay: -4.5s;
                }
        
        .borderline::after {
            animation-delay: -4.5s;
        }
        
        @keyframes animate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        /* Form Styling */
        .box form {
            position: absolute;
            inset: 4px;
            background: #222;
            padding: 50px 40px;
            border-radius: 8px;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }
        
        .box form h2 {
            color: #fff;
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.1em;
        }
        
        .box form .inputBox {
            position: relative;
            width: 300px;
            margin-top: 35px;
            color: black;
        }
        
        .box form .inputBox span {
            position: absolute;
            margin-bottom:10px;
            left: 0;
            padding: 20px 0px 10px;
            pointer-events: none;
            color: #8f8f8f;
            font-size: 1em;
            letter-spacing: 0.05em;
            transition: 0.5s;
        }
        
        .box form .inputBox input {
            width: 100%;
            padding: 10px 0;
            padding: 10px 0 10px 10px; 
            background: transparent;
            border: none;
            outline: none;
            color: #000000;
            font-size: 1em;
            letter-spacing: 0.05em;
            z-index: 2;
            position: relative;
        }
        
        .box form .inputBox input:valid ~ span,
        .box form .inputBox input:focus ~ span {
            color: #fff;
            font-size: 0.75em;
            transform: translateY(-34px);
        }
        
        .box form .inputBox i {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 2px;
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            transition: 0.5s;
            pointer-events: none;
            z-index: 1;
        }
        
        .box form .inputBox input:valid ~ i,
        .box form .inputBox input:focus ~ i {
            height: 40px;
        }
        
        /* Submit Button Styling */
        button{
            border: none;
            outline: none;
            padding: 9px 25px;
            background: #fff;
            cursor: pointer;
            font-size: 0.9em;
            border-radius: 4px;
            font-weight: 600;
            width: 100%; /* Set button to full width */
            margin-top: 20px; /* Increase top margin for better spacing */
            text-align: center; /* Center the text */
        }
        button:hover{
            border: none;
            outline: none;
            padding: 9px 25px;
            background: #45f3ff;
            color:white;
            cursor: pointer;
            font-size: 0.9em;
            border-radius: 4px;
            font-weight: 600;
            width: 100%; /* Set button to full width */
            margin-top: 20px; /* Increase top margin for better spacing */
            text-align: center; /* Center the text */
        }

        
        .box form input[type="submit"]:active {
            opacity: 0.8;
        }
        
</style>        
 </head>
 <div class="box"> 
    <span class="borderline"></span> 
    <form th:action="@{/login}" method="post"> 
        <h2><b>Login</b></h2>
         <div class="inputBox"> 
            <input type="text" id="username" name="username" required="required"> 
            <span>Username</span><i></i>
        </div> 
        <div class="inputBox"> 
            <input type="password" id="password" name="password" required="required"> 
            <span>Password</span><i></i>
        </div> 
             <button type="submit"><b>Login</b></button>
        </form> 
    </div> 
</body>
</html>
